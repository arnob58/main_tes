    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const websiteForm = document.getElementById('websiteForm');
            const websiteList = document.getElementById('websiteList');

            // Load websites from local storage
            function loadWebsites() {
                const websites = JSON.parse(localStorage.getItem('websites')) || [];
                websiteList.innerHTML = ''; // Clear existing entries
                websites.forEach(website => {
                    const row = websiteList.insertRow();
                    row.insertCell(0).textContent = website.name;
                    row.insertCell(1).textContent = website.url;
                    row.insertCell(2).textContent = website.notes;
                });
            }

            // Save websites to local storage
            function saveWebsites() {
                const tableRows = websiteList.querySelectorAll('tr');
                const websites = [];
                tableRows.forEach(row => {
                    const name = row.cells[0].textContent;
                    const url = row.cells[1].textContent;
                    const notes = row.cells[2].textContent;
                    websites.push({ name, url, notes });
                });
                localStorage.setItem('websites', JSON.stringify(websites));
            }
