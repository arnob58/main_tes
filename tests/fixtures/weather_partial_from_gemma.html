<style>
    :root {
        --bg-start: #87CEEB;
        --bg-end: #70A0A0;
        --card-bg: rgba(255, 255, 255, 0.2);
        --card-border: rgba(255, 255, 255, 0.4);
        --text-color: #ffffff;
        --primary-color: #4CAF50;
        --shadow-light: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        --blur-effect: 10px;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
    }

    h1 {
        margin-bottom: 30px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
    }

    #input-container {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 30px;
        box-shadow: var(--shadow-light);
        width: 100%;
        max-width: 600px;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    #city-input {
        flex-grow: 1;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 8px;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.3);
        color: var(--text-color);
        transition: all 0.3s ease;
    }

    #city-input:focus {
        outline: none;
        border-color: var(--primary-color);
        background: rgba(255, 255, 255, 0.4);
    }

    #add-city-btn {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: var(--primary-color);
        color: white;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.3s ease, transform 0.2s;
    }

    #add-city-btn:hover {
        background: #388E3C;
        transform: translateY(-2px);
    }

    #weather-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 25px;
        width: 100%;
        max-width: 1200px;
    }

    .weather-card {
        background: var(--card-bg);
        backdrop-filter: blur(15px);
        border: 1px solid var(--card-border);
        border-radius: 15px;
        padding: 25px;
        box-shadow: var(--shadow-light);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 250px;
    }

    .weather-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .city-name {
        font-size: 1.5em;
        font-weight: 600;
    }

    .remove-btn {
        background: none;
        border: none;
        color: #ff6b6b;
        cursor: pointer;
        font-size: 1.2em;
        opacity: 0.7;
        transition: opacity 0.2s;
    }.remove-btn:hover {
        opacity: 1;
        color: #ff0000;
    }

    .weather-card {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 100, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 20px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 200px;
    }

    .weather-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 40px 0 rgba(255, 107, 107, 0.4);
    }

    .city-name {
        font-size: 1.5em;
        font-weight: 600;
        margin-bottom: 10px;
        color: #ffffff;
    }

    .temperature {
        font-size: 2.5em;
        font-weight: 700;
        margin: 15px 0;
        color: #ffd700;
    }

    .description {
        font-size: 1.1em;
        color: #e0e0e0;
        margin-bottom: 15px;
    }

    .details p {
        margin: 5px 0;
        font-size: 0.95em;
        color: #cccccc;
    }

    .remove-btn {
        background: none;
        border: none;
        color: #ff6b6b;
        cursor: pointer;
        font-size: 1.2em;
        opacity: 0.7;
        transition: opacity 0.2s;
        align-self: flex-end;
    }

    .remove-btn:hover {
        opacity: 1;
        color: #ff0000;
    }

    #city-input-container {
        margin-bottom: 30px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #city-input {
        padding: 10px;
        border: none;
        border-radius: 8px;
        margin-right: 10px;
        flex-grow: 1;
        font-size: 1em;
        background: rgba(255, 255, 255, 0.9);
        color: #333;
    }

    #add-city-btn {
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(45deg, #ff6b6b, #ff4d4d);
        color: white;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.3s ease;
    }

    #add-city-btn:hover {
        background: linear-gradient(45deg, #ff4d4d, #ff6b6b);
    }

    #message-area {
        text-align: center;
        padding: 40px;
        color: #ffffff;
        font-size: 1.5em;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        margin-bottom: 20px;
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-grow: 1;
    }

    .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
        padding: 20px;
    }

    @media (max-width: 768px) {
        .grid-container {
            grid-template-columns: 1fr;
            padding: 15px;
        }
    }
<div class="container">
    <header>
        <h1>Beautiful Weather Tracker</h1>
        <div class="input-group">
            <input type="text" id="cityInput" placeholder="Enter a city name...">
            <button id="addCityBtn">Add City</button>
        </div>
    </header>

    <main>
        <div id="messageArea" class="message-box">
            <p>Start by adding a city to see the weather!</p>
        </div>
        <div id="weatherGrid" class="grid-container">
            <!-- Weather cards will be inserted here by JavaScript -->
        </div>
    </main>
</div>
